<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión · Deudas y Préstamos</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-logo">DP</div>
        <div class="brand-title">
          <span>DebtPanel</span>
          <span>Deudas & Préstamos</span>
        </div>
      </div>

      <h1 class="login-title">Iniciar sesión</h1>
      <p class="login-subtitle">
        Ingresa tus credenciales para acceder al panel de control.
      </p>

      <form id="loginForm" class="login-form">
        <div class="field">
          <label for="loginUsuario">Usuario o correo</label>
          <input
            id="loginUsuario"
            type="text"
            placeholder="usuario@ejemplo.com"
            required
          />
        </div>

        <div class="field">
          <label for="loginPassword">Contraseña</label>
          <input
            id="loginPassword"
            type="password"
            placeholder="••••••••"
            required
          />
        </div>

        <div class="login-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe" />
            <span>Recordar sesión</span>
          </label>
          <a href="#" class="login-link">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn-primary login-button">
          Entrar al sistema
        </button>
      </form>

      <p class="login-footer">
        Demo: usa <strong>admin</strong> / <strong>123456</strong> para ingresar.
      </p>

      <a href="index.html" class="login-link-back">Volver al dashboard</a>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
